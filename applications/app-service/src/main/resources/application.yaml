server:
  port: 8080
spring:
  application:
    name: "cy-autenticacion"
  devtools:
    add-properties: false
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "crediya-autenticacion"
    schema: "public"
    username: "postgres"
    password: "123456"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
